[project]
name = "stricknani-tooling"
version = "1.0.0"
description = "Development tooling for Stricknani: i18n catalog generators and browser/CI harnesses (the product itself is Rust, web/ and android/)"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Philipp Schmitt", email = "philipp@schmitt.co" }
]
requires-python = ">=3.12"
# Nothing in this project is installed or shipped. The scripts under scripts/
# and ci/ and their tests only need the dev group below.
dependencies = []

[dependency-groups]
dev = [
    # Translation catalog tooling (scripts/*_i18n.py, scripts/check_translations.py).
    "babel>=2.14.0",
    # Browser acceptance harnesses (ci/stricknani/web_*_browser.py).
    "playwright==1.64.1",
    "pytest>=8.3.3",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["ci", "scripts"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = [
    ".venv",
]

[[tool.mypy.overrides]]
# Shapely ships no type stubs; only the branding generator uses it.
module = ["shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
