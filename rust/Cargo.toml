[package]
name = "stricknani-server"
version = "1.0.1"
edition = "2024"
publish = false

[dependencies]
scraper = { version = "0.29", features = ["atomic"] }
lopdf = "0.45"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"
ammonia = "4"
pulldown-cmark = "0.13"
subtle = "2"
url = "2"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bcrypt = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
openidconnect = { version = "=4.0.1", default-features = false }
zeroize = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12.1"
hex = "0.4"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
askama = "0.16"
axum = { version = "0.8", features = ["form", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "fs", "io-util", "signal", "time", "process", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
rsa = { version = "=0.9.10", features = ["pem"] }
