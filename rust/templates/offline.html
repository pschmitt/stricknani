<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6fed">
    <title>{{ labels.heading.en }} · Stricknani</title>
    <link rel="stylesheet" href="/static/css/material.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/rust.css">
</head>
<body class="rust-app bg-base-100 text-base-content">
<main class="page-content max-w-2xl mx-auto p-6 md:p-10">
    <h1 class="text-3xl font-bold mb-6">{{ labels.heading.en }}</h1>
    <section lang="en" aria-labelledby="offline-en-title">
        <span>{{ labels.status.en }}</span>
        <h2 id="offline-en-title" class="text-xl font-semibold">{{ labels.reason.en }}</h2>
        <p class="my-3">{{ labels.message.en }}</p>
        <p><a class="link" href="/">{{ labels.action.en }}</a></p>
    </section>
    <section lang="de" aria-labelledby="offline-de-title" class="mt-8">
        <span>{{ labels.status.de }}</span>
        <h2 id="offline-de-title" class="text-xl font-semibold">{{ labels.heading.de }}</h2>
        <p class="font-semibold">{{ labels.reason.de }}</p>
        <p class="my-3">{{ labels.message.de }}</p>
        <p><a class="link" href="/">{{ labels.action.de }}</a></p>
    </section>
</main>
</body>
</html>
