[versions]
android-plugin = "9.3.2"
androidx-activity = "1.13.0"
# Per-app language picker (SNA-37) - AppCompatDelegate.setApplicationLocales works with a plain
# ComponentActivity (no AppCompatActivity needed) and auto-persists the choice across API levels.
androidx-appcompat = "1.8.0"
# QR scanning for SNA-13's onboarding flow - same versions as the sibling apps' scanners
# (nyetbox/jollyfin), so the fleet stays on one known-good CameraX/ZXing combination.
androidx-camera = "1.6.2"
androidx-compose = "1.12.0"
# Decoupled from androidx-compose above - this artifact's release cadence lags the rest of
# Compose, but it's just a large set of static ImageVector vals with no API coupling to newer
# compose-ui/foundation versions, so it's safe to pin independently (same call as the sibling
# nyetbox/syncwich apps).
androidx-compose-material-icons-extended = "1.7.8"
androidx-compose-material3 = "1.4.0"
androidx-core = "1.19.0"
androidx-core-splashscreen = "1.2.0"
androidx-datastore = "1.2.1"
androidx-hilt = "1.4.0"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.9.8"
androidx-room = "2.8.4"
androidx-security-crypto = "1.1.0"
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-uiautomator = "2.4.0"
androidx-espresso = "3.7.0"
androidx-work = "2.11.2"
coil = "3.6.0"
errorprone-annotations = "2.50.0"
fastlane-screengrab = "2.1.1"
hilt = "2.60.1"
junit = "4.13.2"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0-0.6.x-compat"
kotlinx-serialization = "1.11.0"
ksp = "2.3.11"
ktfmt = "0.27.0"
markdown-renderer = "0.44.0"
okhttp = "5.5.0"
retrofit = "3.0.0"
retrofit-kotlinx-serialization-converter = "1.0.0"
timber = "5.0.1"
zxing-core = "3.5.4"

