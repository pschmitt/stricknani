<div class="md3-language-selector {{ container_class|default('') }}">
    <form action="/auth/set-language" method="post" class="md3-language-selector__form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next"
            value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
        <input type="hidden" name="language" value="en">
        <button type="submit"
            class="md3-language-selector__button{% if current_language == 'en' %} is-active{% endif %}">
            🇬🇧 EN
        </button>
    </form>
    <form action="/auth/set-language" method="post" class="md3-language-selector__form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next"
            value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
        <input type="hidden" name="language" value="de">
        <button type="submit"
            class="md3-language-selector__button{% if current_language == 'de' %} is-active{% endif %}">
            🇩🇪 DE
        </button>
    </form>
</div>
