<div class="md3-empty-state md3-empty-state--surface">
    <div class="md3-empty-icon mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-200">
        <span class="mdi {{ empty_icon }} text-2xl"></span>
    </div>
    <p class="text-lg font-semibold text-base-content">{{ empty_title }}</p>
    <p class="text-sm text-base-content/70">{{ empty_body }}</p>
    <div class="md3-action-row">
        <a
            href="{{ empty_action_url }}"
            class="md3-button md3-button--filled"
        >
            <span class="mdi {{ empty_action_icon }}"></span>
            {{ empty_action_label }}
        </a>
    </div>
</div>
