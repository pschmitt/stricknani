apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: stricknani/static/vendor
    contents:
      # renovate: datasource=npm depName=@mdi/font
      - path: mdi
        http:
          url: https://registry.npmjs.org/@mdi/font/-/font-7.4.47.tgz
        newRootPath: package
        includePaths:
          - package/css/materialdesignicons.min.css
          - package/fonts/**

      # renovate: datasource=npm depName=photoswipe
      - path: photoswipe
        http:
          url: https://registry.npmjs.org/photoswipe/-/photoswipe-5.4.4.tgz
        newRootPath: package/dist
        includePaths:
          - package/dist/photoswipe.css
          - package/dist/photoswipe-lightbox.esm.min.js
          - package/dist/photoswipe.esm.min.js

      # renovate: datasource=npm depName=cropperjs
      - path: cropperjs
        http:
          url: https://registry.npmjs.org/cropperjs/-/cropperjs-2.1.0.tgz
        newRootPath: package/dist
        includePaths:
          - package/dist/cropper.min.js

      # renovate: datasource=npm depName=htmx.org
      - path: htmx
        http:
          url: https://registry.npmjs.org/htmx.org/-/htmx.org-2.0.8.tgz
        newRootPath: package/dist
        includePaths:
          - package/dist/htmx.min.js

      # renovate: datasource=github-releases depName=getsentry/sentry-javascript
      - path: sentry
        http:
          url: https://browser.sentry-cdn.com/10.38.0/bundle.tracing.min.js

      # renovate: datasource=npm depName=@fontsource/space-grotesk
      - path: fonts/space-grotesk
        http:
          url: https://registry.npmjs.org/@fontsource/space-grotesk/-/space-grotesk-5.3.0.tgz
        newRootPath: package/files
        includePaths:
          - package/files/space-grotesk-latin-500-normal.woff2
          - package/files/space-grotesk-latin-600-normal.woff2
          - package/files/space-grotesk-latin-700-normal.woff2
          - package/files/space-grotesk-latin-ext-500-normal.woff2
          - package/files/space-grotesk-latin-ext-600-normal.woff2
          - package/files/space-grotesk-latin-ext-700-normal.woff2
