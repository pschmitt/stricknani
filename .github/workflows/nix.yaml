name: Nix Build

on:
  push:
    branches: [ main ]
    paths:
      - "stricknani/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "justfile"
      - ".github/workflows/nix.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "stricknani/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "justfile"
      - ".github/workflows/nix.yaml"

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run nix flake check
        run: nix flake check

      - name: Build with Nix
        run: just build-nix

      - name: Build Nix container
        run: just build-container

  # aarch64-linux packages and checks, built natively on GitHub's arm runners
  # (nixbot on x86_64 would have to emulate them) and pushed to the niks3 S3
  # cache; see pschmitt/ci-workflows. Nothing here needs KVM.
  nix-aarch64:
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-aarch64.yaml@main
    with:
      pin-prefix: gh-stricknani-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
