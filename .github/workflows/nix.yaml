name: Nix Build

on:
  push:
    branches: [ main, rust ]
    paths:
      - "web/**"
      - "rust/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "Dockerfile"
      - "justfile"
      - ".github/workflows/nix.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "web/**"
      - "rust/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "Dockerfile"
      - "justfile"
      - ".github/workflows/nix.yaml"

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run nix flake check
        run: nix flake check

      - name: Build with Nix
        run: just build-nix

      - name: Build Nix container
        run: just build-container

      - name: Build Rust candidate image
        run: nix build '.#stricknani-rust-docker' --out-link result-rust-image

      - name: Verify Rust candidate image
        run: |
          set -Eeuo pipefail

          image_name="ghcr.io/pschmitt/stricknani-rust-candidate:latest"
          container_name="stricknani-rust-candidate-test"
          health_url="http://127.0.0.1:7674/healthz"

          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker load < result-rust-image
          docker run --detach --publish 7674:7674 --name "$container_name" \
            --env RUST_DATABASE_URL=sqlite::memory: \
            --env RUST_MEDIA_ROOT=/tmp/stricknani-rust-media \
            --env TRUSTED_HOSTS=127.0.0.1,localhost \
            --env SESSION_COOKIE_SECURE=true \
            "$image_name"

          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            if curl --fail --silent --show-error "$health_url"; then
              exit 0
            fi

            if ! docker container inspect "$container_name" >/dev/null 2>&1; then
              printf '%s\n' 'Rust candidate container exited before becoming ready.' >&2
              exit 1
            fi

            sleep 2
          done

          printf 'Timed out waiting for %s after 60 seconds.\n' "$health_url" >&2
          docker logs "$container_name" >&2 || true
          exit 1

  # aarch64-linux packages and checks, built natively on GitHub's arm runners
  # (nixbot on x86_64 would have to emulate them) and pushed to the niks3 S3
  # cache from main and pull requests (the server only trusts those refs); see
  # pschmitt/ci-workflows. Nothing here needs KVM.
  nix-aarch64:
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-aarch64.yaml@main
    with:
      pin-prefix: gh-stricknani-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
