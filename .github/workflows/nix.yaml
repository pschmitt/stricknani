name: Nix Build

on:
  push:
    branches: [ main ]
    paths:
      - "stricknani/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "justfile"
      - ".github/workflows/nix.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "stricknani/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "justfile"
      - ".github/workflows/nix.yaml"

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run nix flake check
        run: nix flake check

      - name: Build with Nix
        run: just build-nix

      - name: Build Nix container
        run: just build-container
