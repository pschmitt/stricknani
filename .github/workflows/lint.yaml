name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: just ci-setup-py

      - name: Run Ruff
        run: just lint-ruff

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: just ci-setup-py

      - name: Run MyPy
        run: just lint-mypy

  template-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: just ci-setup-py

      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          version: "2.2.5"

      - name: Lint template JS syntax
        run: just lint-template-js

      - name: Check template JS formatting
        run: just lint-template-js-format

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          version: "2.2.5"

      - name: Run JavaScript lint
        run: just lint-js

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          version: "2.2.5"

      - name: Run CSS lint
        run: just lint-css
