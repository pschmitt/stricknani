name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - "ci/**"
      - "scripts/**"
      - "tests/**"
      - "rust/static/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - "biome.json"
      - ".github/workflows/lint.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "ci/**"
      - "scripts/**"
      - "tests/**"
      - "rust/static/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - "biome.json"
      - ".github/workflows/lint.yaml"

jobs:
  # The Python in this repository is development tooling only (i18n
  # generators and browser/CI harnesses).
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: just ci-setup-py

      - name: Run Ruff
        run: just lint-ruff

      - name: Run MyPy
        run: just lint-mypy

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          version: "2.6.4"

      - name: Run CSS lint
        run: just lint-css
