name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - "web/e2e/**"
      - "web/scripts/**"
      - "web/playwright.config.ts"
      - "web/package.json"
      - "web/package-lock.json"
      - "ci/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/lint.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "web/e2e/**"
      - "web/scripts/**"
      - "web/playwright.config.ts"
      - "web/package.json"
      - "web/package-lock.json"
      - "ci/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/lint.yaml"

concurrency:
  # A newer push to the same branch or pull request supersedes this run;
  # manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The browser acceptance suite and the i18n generators are TypeScript/Node
  # development tooling under web/.
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Type-check and format-check the tooling
        run: nix develop '.#tooling' --command just web-check
