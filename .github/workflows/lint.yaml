name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - "ci/**"
      - "scripts/**"
      - "tests/**"
      - "rust/static/**"
      - "pyproject.toml"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - "biome.json"
      - ".github/workflows/lint.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "ci/**"
      - "scripts/**"
      - "tests/**"
      - "rust/static/**"
      - "pyproject.toml"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - "biome.json"
      - ".github/workflows/lint.yaml"

jobs:
  # The Python in this repository is development tooling only (i18n
  # generators and browser/CI harnesses).
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run Ruff
        run: nix develop '.#tooling' --command just lint-ruff

      - name: Run MyPy
        run: nix develop '.#tooling' --command just lint-mypy

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          version: "2.6.4"

      - name: Run CSS lint
        run: just lint-css
