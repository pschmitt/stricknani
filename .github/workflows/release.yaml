name: Release

# The shared release workflow owns signing, Gradle builds, APK verification, checksums, release
# publication, and the tagged-release screenshot dispatch. This caller only supplies Stricknani's
# triggers and monorepo-specific paths.

on:
  push:
    # Deliberately no `paths:` filter here: GitHub combines `paths` with `tags` via AND, and path
    # filtering is unreliable for a brand-new tag ref. A skipped real release tag is worse than an
    # occasional backend-triggered rolling build.
    branches:
      - main
    tags:
      - v*
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: pschmitt/android-app-ci/.github/workflows/release.yaml@main
    with:
      app-display-name: Stricknani
      application-id: blue.anika.wolle
      artifact-label: stricknani
      project-directory: android
      keystore-file-name: stricknani-ci.jks
      gradle-debug-task: :app:assembleDebug
      gradle-release-task: :app:assembleRelease
      unit-test-task: :app:testDebugUnitTest
      release-log-path: android
      release-apk-paths: |
        app/build/outputs/apk/release/app-arm64-v8a-release.apk
        app/build/outputs/apk/release/app-armeabi-v7a-release.apk
        app/build/outputs/apk/release/app-x86_64-release.apk
        app/build/outputs/apk/release/app-x86-release.apk
      debug-apk-paths: |
        app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
        app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
        app/build/outputs/apk/debug/app-x86_64-debug.apk
        app/build/outputs/apk/debug/app-x86-debug.apk
      compute-version-name: true
      screenshots-workflow: android-screenshots.yaml
      trigger-screenshots: true
      verify-git-revision: true
    secrets: inherit
