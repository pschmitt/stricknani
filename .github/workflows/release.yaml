name: Release

# Product-specific release assembly: Android JNI libraries and signed APKs,
# static server binaries and the web archive form one checksummed asset set.
# Shared actions handle Gradle setup, signing and the gated Play upload.
#
# One pipeline, two release flavors depending on what got pushed:
# - a push to main moves the rolling "latest" prerelease tag and republishes it (debug + release
#   APKs, always prerelease, never the repo's "Latest release" badge)
# - a push of a semantic-version tag ("vX.Y.Z" or "X.Y.Z") publishes a real, permanent release at
#   that tag (release and debug APKs, becomes the repo's "Latest release"); debug installs on the
#   Stable channel update from these
#
# A semantic-version tag also publishes to Google Play, in parallel with the GitHub release: the
# version, validate and play-store jobs (formerly play-store.yaml). Stable tags upload a signed
# bundle to the internal and closed (alpha) testing tracks in one go, through
# pschmitt/ci-workflows's reusable play-store.yaml, which also requires the repository variable
# PLAY_PUBLISH_ENABLED=true and the PLAY_SERVICE_ACCOUNT_JSON secret (see
# android/docs/play-store-release.md); a tag push fails loudly instead of silently publishing if
# either is missing. Version resolution stays local: a real value is computed on every run.
#
# Assets (tag release and "latest" alike): the eight APKs (release + debug, four ABIs), static musl
# `stricknani-server` binaries for Linux x86_64 and aarch64 (built natively with Nix, aarch64 on
# GitHub's arm runners), the built web app as `stricknani-web-<tag>.tar.gz`, and `SHA256SUMS` over all
# of them (also the subject of the build-provenance attestation).
#
# Builds and publishing are separate jobs. A newer push cancels the older run's *builds* (job-level
# concurrency), but never its `publish` job: cancelling an upload midway used to leave "latest"
# with a single APK (softprops/action-gh-release replaces each asset as it uploads them in parallel).
# `publish` runs serially per ref, so the rolling release is always replaced as a whole.
#
# A manual dispatch runs one lane: `github-release` (the GitHub release for the dispatched ref) or
# `play-store` (a Play build, by default without uploading; see the inputs).
#
# Needs these repo secrets to produce a *signed* release: CI_KEYSTORE_BASE64, CI_KEYSTORE_PASSWORD,
# CI_KEY_ALIAS, CI_KEY_PASSWORD - see the "Stricknani Android CI Signing Keystore" rbw entry
# (android/justfile's `build variant=release` uses the same keystore for local release builds).

on:
  push:
    branches:
      - main
    tags:
      - v*
      - "*.*.*"
  workflow_dispatch:
    inputs:
      lane:
        description: "What to release: the GitHub release of this ref, or a Play Store build"
        required: true
        default: github-release
        type: choice
        options:
          - github-release
          - play-store
      version_code:
        description: "Override versionCode (leave blank on a tag build to derive it from the tag)"
        required: false
        type: string
      version_name:
        description: "Override versionName (leave blank on a tag build to derive it from the tag)"
        required: false
        type: string
      track:
        description: "Play track(s), comma-separated (e.g. internal,alpha)"
        required: false
        default: "internal,alpha"
        type: string
      production_confirmation:
        description: "Required only when track includes production: type I_UNDERSTAND_PRODUCTION_UPLOAD"
        required: false
        default: ""
        type: string
      dry_run:
        description: "github-release lane: build everything and attach the release assets to the run as an artifact, without touching any release or tag"
        required: false
        default: false
        type: boolean
      publish:
        description: "Upload the bundle to the requested Play track(s)"
        required: true
        default: false
        type: boolean
      release_status:
        description: "Play release status (draft for the first release of a draft app)"
        required: false
        default: draft
        type: string

# No workflow-level concurrency: see the header. Each build job cancels its predecessor on a branch
# push (tags always run to completion); `publish` queues instead.

permissions:
  contents: read

jobs:
  local-server-libs:
    # T130: the Rust server as a JNI library for the local-only mode (docs/local-only.md), packaged
    # into the APKs and the Play bundle from android/local-server-libs.
    name: In-app server libraries
    runs-on: ubuntu-26.04
    concurrency:
      group: release-libs-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-local-server

      - name: Install cargo-ndk
        # Built from crates.io: the prebuilt download via install-action failed once (2026-11-08).
        run: cargo install cargo-ndk --locked

      - name: Build and strip the libraries
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            rustc --release --lib --crate-type cdylib
          strip="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          declare -A triples=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=armv7-linux-androideabi
            [x86_64]=x86_64-linux-android
          )
          for abi in "${!triples[@]}"; do
            mkdir -p "android/local-server-libs/$abi"
            "$strip" -o "android/local-server-libs/$abi/libstricknani_server.so" \
              "target/${triples[$abi]}/release/libstricknani_server.so"
          done
          ls -la android/local-server-libs/*

      - name: Upload the libraries
        uses: actions/upload-artifact@v7
        with:
          name: local-server-libs
          path: android/local-server-libs
          if-no-files-found: error
          retention-days: 7

  params:
    name: Release parameters
    if: ${{ github.event_name == 'push' || inputs.lane == 'github-release' }}
    runs-on: ubuntu-26.04
    outputs:
      tag_name: ${{ steps.params.outputs.tag_name }}
      release_name: ${{ steps.params.outputs.release_name }}
    steps:
      - name: Determine release parameters
        # A pushed semantic-version tag gets its own permanent release; anything else (a main push,
        # or a manual dispatch off main) republishes the rolling "latest" prerelease instead.
        id: params
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            {
              echo "tag_name=$REF_NAME"
              echo "release_name=$REF_NAME"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag_name=latest"
              echo "release_name=Latest build"
            } >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Android APKs
    needs: [params, local-server-libs]
    runs-on: ubuntu-26.04
    concurrency:
      group: release-apks-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pschmitt/ci-workflows/.github/actions/setup-jdk-gradle@main

      - name: Download the in-app server libraries
        uses: actions/download-artifact@v8
        with:
          name: local-server-libs
          path: android/local-server-libs

      - name: Decode CI signing keystore
        id: ci_keystore
        uses: pschmitt/ci-workflows/.github/actions/decode-ci-keystore@main
        with:
          keystore-base64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          file-name: stricknani-ci.jks

      - name: Compute git revision
        id: git_revision
        run: echo "value=$(git describe --always --abbrev=12 --dirty --exclude=latest)" >> "$GITHUB_OUTPUT"

      - name: Resolve Android version name
        id: version
        env:
          REVISION: ${{ steps.git_revision.outputs.value }}
        run: |
          if [[ "$REVISION" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)([-+].*)?$ ]]; then
            version_name="${BASH_REMATCH[1]}"
          else
            version_name="0.1.0"
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build APKs
        # CI_KEYSTORE_PATH etc. are only exported when signing is enabled: build.gradle.kts's
        # signingConfig guards on `System.getenv("CI_KEYSTORE_PATH")?.let { ... }`, which only skips
        # a null env var - an empty string still trips `file("")` inside Gradle.
        working-directory: android
        env:
          GIT_REVISION: ${{ steps.git_revision.outputs.value }}
          CI_KEYSTORE_PATH: ${{ steps.ci_keystore.outputs.path }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
          # Uploads the release R8 mapping to Sentry (see android/app/build.gradle.kts).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_DATE
          ./gradlew \
            :app:assembleDebug \
            :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PreleaseChannel=${{ needs.params.outputs.tag_name == 'latest' && 'latest' || 'stable' }} \
            --stacktrace --build-cache

      - name: Verify embedded Android version name
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.name }}
        run: |
          aapt2_path="$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)"
          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            actual_version="$($aapt2_path dump badging "$apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
            if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
              echo "::error::$apk: expected Android version $EXPECTED_VERSION, got $actual_version" >&2
              exit 1
            fi
          done <<< "$(printf 'android/app/build/outputs/apk/release/app-arm64-v8a-release.apk\nandroid/app/build/outputs/apk/release/app-armeabi-v7a-release.apk\nandroid/app/build/outputs/apk/release/app-x86_64-release.apk\nandroid/app/build/outputs/apk/release/app-x86-release.apk')"

      - name: Verify embedded git revision
        # Confirms GIT_REVISION actually made it into every release artifact instead of silently
        # falling back to "unknown".
        env:
          REVISION: ${{ steps.git_revision.outputs.value }}
        run: |
          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            if ! unzip -p "$apk" 'classes*.dex' | strings | grep -Fx "$REVISION" >/dev/null; then
              echo "::error::$apk does not contain expected revision: $REVISION" >&2
              exit 1
            fi
          done <<< "$(printf 'android/app/build/outputs/apk/release/app-arm64-v8a-release.apk\nandroid/app/build/outputs/apk/release/app-armeabi-v7a-release.apk\nandroid/app/build/outputs/apk/release/app-x86_64-release.apk\nandroid/app/build/outputs/apk/release/app-x86-release.apk')"

      - name: Collect and rename APKs
        env:
          LABEL: stricknani-${{ needs.params.outputs.tag_name }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/apks"
          mkdir -p "$dir"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for variant in release debug; do
              apk="android/app/build/outputs/apk/$variant/app-$abi-$variant.apk"
              cp "$apk" "$dir/$LABEL-$(basename "$apk")"
            done
          done
          ls -la "$dir"
          [ "$(ls -1 "$dir" | wc -l)" -eq 8 ]

      - name: Upload the APKs
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: ${{ runner.temp }}/apks/*
          if-no-files-found: error
          retention-days: 7

  web:
    # The web output is architecture independent. Build and archive it once; both native server
    # jobs use this exact artifact for smoke tests, and x86_64 includes it in the release assets.
    name: Web asset
    needs: params
    runs-on: ubuntu-latest
    concurrency:
      group: release-web-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      TAG: ${{ needs.params.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix with the niks3 cache
        uses: pschmitt/ci-workflows/.github/actions/nix-niks3@main
        with:
          s3-store: ${{ secrets.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
          extra-conf: |
            nix-path = nixpkgs=channel:nixos-unstable

      - name: Wait for the Build Nix producer
        id: producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PRODUCER_WORKFLOW: build.yaml
          PRODUCER_JOB: nix / build
          PRODUCER_JOBS: nix / build,nix-checks / checks,nix-aarch64 / build,nix-aarch64-checks / checks
          ALLOW_STANDALONE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/wait-for-nix-producer.mjs

      - name: Download producer source metadata
        if: steps.producer.outputs.standalone != 'true'
        uses: actions/download-artifact@v8
        with:
          name: nix-producer-metadata
          run-id: ${{ steps.producer.outputs.producer_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nix-producer

      - name: Verify producer source metadata
        if: steps.producer.outputs.standalone != 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCER_RUN_ID: ${{ steps.producer.outputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.producer_run_attempt }}
          PRODUCER_METADATA_FILE: ${{ runner.temp }}/nix-producer/nix-producer.json
        run: node ci/wait-for-nix-producer.mjs --verify

      - name: Build the web app
        run: nix build --print-build-logs --out-link result-web '.#stricknani-web'

      - name: Archive the web app
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/web-assets"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -C result-web -czf "$RUNNER_TEMP/web-assets/stricknani-web-$TAG.tar.gz" .

      - name: Upload the web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: ${{ runner.temp }}/web-assets/stricknani-web-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  server:
    # Build each native static (musl) server binary. The x86_64 job also stages the single web
    # archive produced above; both smoke tests consume that same web artifact.
    name: Server (linux-${{ matrix.arch }})
    needs: [params, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: release-server-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.params.outputs.tag_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the web artifact
        uses: actions/download-artifact@v8
        with:
          name: release-web
          path: ${{ runner.temp }}/web-assets

      - name: Install Nix with the niks3 cache
        uses: pschmitt/ci-workflows/.github/actions/nix-niks3@main
        with:
          s3-store: ${{ secrets.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
          extra-conf: |
            nix-path = nixpkgs=channel:nixos-unstable

      - name: Build the static server
        run: nix build --print-build-logs --out-link result-server '.#stricknani-server-static'

      - name: Extract the web app
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p result-web
          tar -xzf "$RUNNER_TEMP/web-assets/stricknani-web-$TAG.tar.gz" -C result-web

      - name: Stage the assets
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/server-assets"
          mkdir -p "$out"
          binary="$out/stricknani-server-$TAG-linux-$ARCH"
          install -m 0755 result-server/bin/stricknani-server "$binary"
          file "$binary"
          # A dynamic binary would not run on the hosts this is meant for.
          file "$binary" | grep -E 'statically linked|static-pie linked'
          # Ship the shared web artifact once, alongside the x86_64 server.
          if [[ "$ARCH" == x86_64 ]]
          then
            cp "$RUNNER_TEMP/web-assets/stricknani-web-$TAG.tar.gz" "$out/"
          fi
          ls -la "$out"

      - name: Smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/media"
          STRICKNANI_DATABASE_URL='sqlite::memory:' \
          STRICKNANI_MEDIA_ROOT="$RUNNER_TEMP/media" \
          WEB_ROOT="$PWD/result-web" \
          BIND_PORT=17674 \
          TRUSTED_HOSTS=127.0.0.1,localhost \
            "$RUNNER_TEMP/server-assets/stricknani-server-$TAG-linux-$ARCH" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 60))
          until curl --fail --silent --show-error http://127.0.0.1:17674/healthz
          do
            if (( SECONDS >= deadline )) || ! kill -0 "$server_pid" 2>/dev/null
            then
              echo "The static server did not become healthy." >&2
              exit 1
            fi
            sleep 2
          done
          echo

      - name: Upload the server assets
        uses: actions/upload-artifact@v7
        with:
          name: release-server-${{ matrix.arch }}
          path: ${{ runner.temp }}/server-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # Serial per ref and never cancelled (see the header): the release's assets are replaced as a
    # whole by one run at a time.
    name: GitHub release
    needs: [params, release, server]
    runs-on: ubuntu-26.04
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.params.outputs.tag_name }}
      RELEASE_NAME: ${{ needs.params.outputs.release_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip a superseded build
        # A newer push to main has its own run; do not let an older commit replace "latest" after it.
        id: stale
        if: ${{ github.ref_type != 'tag' && github.event_name == 'push' }}
        run: |
          head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [[ -n "$head" && "$head" != "$GITHUB_SHA" ]]
          then
            echo "::notice::$GITHUB_SHA is superseded by $head; leaving the release to that run."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the assets
        if: steps.stale.outputs.superseded != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ${{ runner.temp }}/downloaded
          merge-multiple: true

      - name: Assemble the assets and checksums
        id: assets
        if: steps.stale.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/assets"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP"/downloaded/* "$dir/"
          # 8 APKs, 2 server binaries, the web app.
          [ "$(ls -1 "$dir" | wc -l)" -eq 11 ]
          (cd "$dir" && sha256sum -- * > SHA256SUMS)
          cat "$dir/SHA256SUMS"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.stale.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'rm -f "${generated_notes:-}" "${run_howto:-}"' EXIT

          run_howto="$(mktemp)"
          {
            echo "## Running the server without Nix"
            echo
            echo "\`stricknani-server-$TAG-linux-x86_64\` and \`-linux-aarch64\` are static (musl) binaries: no"
            echo "libc or other system libraries needed. The web app is a separate archive; the server serves"
            echo "it under \`/app/\` from \`WEB_ROOT\`. The optional \`tesseract\` OCR engine is not bundled."
            echo
            echo '```sh'
            echo "chmod +x stricknani-server-$TAG-linux-x86_64"
            echo "mkdir -p web media"
            echo "tar -xzf stricknani-web-$TAG.tar.gz -C web"
            echo 'WEB_ROOT="$PWD/web" \'
            echo 'STRICKNANI_DATABASE_URL=sqlite:stricknani.sqlite3 \'
            echo 'STRICKNANI_MEDIA_ROOT="$PWD/media" \'
            echo "./stricknani-server-$TAG-linux-x86_64"
            echo '```'
            echo
            echo "It listens on \`127.0.0.1:7674\`. \`stricknani-server --help\` lists the commands"
            echo "(\`create-admin\`, ...) and every environment variable."
          } > "$run_howto"

          if [[ "$TAG" == latest ]]
          then
            {
              echo "Automated build of the latest main ($GITHUB_SHA), built $(date -u +'%Y-%m-%d %H:%M UTC'). Not a stable release."
              echo
              echo "Two Android variants are provided, both signed with the same CI key so upgrades between them work:"
              echo '- `*-debug.apk` - debuggable, uses the `blue.anika.wolle.debug` applicationId so it installs side by side with a release install for testing.'
              echo '- `*-release.apk` - minified/optimized like a real release build, uses the same `blue.anika.wolle` applicationId as every tagged release, so it upgrades cleanly over (or is upgraded by) any of them.'
              echo
              echo "The server binaries and the web app are built from the same commit."
              echo
              echo '`SHA256SUMS` covers every asset above. Each APK also embeds this exact commit'
              echo "(\`$GITHUB_SHA\`) as \`BuildConfig.GIT_REVISION\`, checkable via Settings in the app."
              echo
              cat "$run_howto"
            } > release-notes.md
            exit 0
          fi

          previous_tag=""
          while IFS= read -r candidate
          do
            if [[ "$candidate" != latest && "$candidate" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
            then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --merged "${GITHUB_SHA}^" --sort=-version:refname)
          if [[ -n "$previous_tag" ]]
          then
            release_range="$previous_tag..$GITHUB_SHA"
          else
            release_range="$GITHUB_SHA"
          fi

          generated_notes="$(mktemp)"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG"
            -f "target_commitish=$GITHUB_SHA"
          )
          if [[ -n "$previous_tag" ]]
          then
            api_args+=(-f "previous_tag_name=$previous_tag")
          fi

          if ! gh api "${api_args[@]}" --jq '.body' > "$generated_notes"
          then
            : > "$generated_notes"
          fi

          {
            echo "# Stricknani $RELEASE_NAME"
            echo
            if [[ -n "$previous_tag" ]]
            then
              echo "Changes since [$previous_tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$previous_tag):"
            else
              echo "Changes included in this release:"
            fi
            echo
            echo "## Summary"
            echo
            git log --no-merges --format='- %s (%h)' "$release_range" -- android
            echo
            if [[ -s "$generated_notes" ]]
            then
              echo "## GitHub details"
              echo
              cat "$generated_notes"
              echo
            fi
            echo "## Installation"
            echo
            echo "Signed with the same CI key as every other build here, so upgrades work cleanly over"
            echo "an existing \`blue.anika.wolle\` install."
            echo
            printf '%s\n' "\`SHA256SUMS\` covers every asset (APKs, server binaries, web app). Each APK embeds commit \`$GITHUB_SHA\`, visible in"
            echo "Settings > About."
            echo
            cat "$run_howto"
          } > release-notes.md

      - name: Attest build provenance
        if: ${{ steps.stale.outputs.superseded != 'true' && env.DRY_RUN != 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ steps.assets.outputs.dir }}/SHA256SUMS

      - name: Preview the assets (dry run)
        if: ${{ steps.stale.outputs.superseded != 'true' && env.DRY_RUN == 'true' }}
        env:
          ASSETS_DIR: ${{ steps.assets.outputs.dir }}
        run: |
          cp release-notes.md "$ASSETS_DIR/RELEASE-NOTES.md"
          echo "Dry run: nothing is published. Assets for '$TAG':"
          ls -la "$ASSETS_DIR"

      - name: Upload the assets (dry run)
        if: ${{ steps.stale.outputs.superseded != 'true' && env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-preview
          path: ${{ steps.assets.outputs.dir }}/*
          if-no-files-found: error
          retention-days: 3

      - name: Move tag
        if: ${{ steps.stale.outputs.superseded != 'true' && env.DRY_RUN != 'true' && env.TAG == 'latest' }}
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Publish release (latest)
        if: ${{ steps.stale.outputs.superseded != 'true' && env.DRY_RUN != 'true' && env.TAG == 'latest' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Latest build"
          body_path: release-notes.md
          files: ${{ steps.assets.outputs.dir }}/*
          prerelease: true
          make_latest: false

      - name: Publish release (tag)
        if: ${{ steps.stale.outputs.superseded != 'true' && env.DRY_RUN != 'true' && env.TAG != 'latest' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release-notes.md
          files: ${{ steps.assets.outputs.dir }}/*
          prerelease: false
          make_latest: true

      - name: Vacuum stale release assets
        # "latest" keeps exactly the current set: whatever this run did not upload goes.
        if: ${{ steps.stale.outputs.superseded != 'true' && env.DRY_RUN != 'true' && env.TAG == 'latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_DIR: ${{ steps.assets.outputs.dir }}
        run: |
          set -euo pipefail
          mapfile -t expected < <(basename -a "$ASSETS_DIR"/*)
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              keep=0
              for f in "${expected[@]}"; do
                [ "$name" = "$f" ] && keep=1 && break
              done
              if [ "$keep" -eq 0 ]; then
                echo "Deleting stale asset: $name"
                gh release delete-asset latest "$name" --repo "$GITHUB_REPOSITORY" -y
              fi
            done
          # Fail loudly if the release does not carry the full set.
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected"
          diff "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"

  # Google Play: tags, or a dispatch with lane play-store.
  version:
    name: Resolve release version and track
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.lane == 'play-store' }}
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.resolve.outputs.code }}
      name: ${{ steps.resolve.outputs.name }}
      track: ${{ steps.resolve.outputs.track }}
    steps:
      - name: Resolve release version and track
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_TRACK: ${{ inputs.track }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        shell: bash
        run: |
          if [[ -n "$INPUT_VERSION_CODE" || -n "$INPUT_VERSION_NAME" ]]; then
            version_code="$INPUT_VERSION_CODE"
            version_name="$INPUT_VERSION_NAME"
          elif [[ "$REF_NAME" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            # Keep version codes deterministic and monotonic for semantic-version tags.
            version_code=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
          else
            echo "Expected a semantic-version tag such as 1.0.0, or explicit version_code/version_name inputs" >&2
            exit 1
          fi
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }
          (( version_code <= 2100000000 )) || {
            echo "version_code exceeds Google Play's maximum" >&2
            exit 1
          }
          [[ "$version_name" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] || {
            echo "version_name contains unsupported characters" >&2
            exit 1
          }

          # Falls back to the fleet default even on a tag push, where inputs.track is unset
          # (workflow_dispatch inputs only populate for dispatch-triggered runs).
          track="${INPUT_TRACK:-internal,alpha}"
          [[ "$track" =~ ^(internal|alpha|beta|production)(,(internal|alpha|beta|production))*$ ]] || {
            echo "track must be a comma-separated list of internal, alpha, beta, and/or production" >&2
            exit 1
          }
          IFS=',' read -ra track_list <<< "$track"
          for t in "${track_list[@]}"; do
            if [[ "$t" == production && "$PRODUCTION_CONFIRMATION" != I_UNDERSTAND_PRODUCTION_UPLOAD ]]
            then
              echo "production requires the exact production_confirmation value" >&2
              exit 1
            fi
          done

          {
            echo "code=$version_code"
            echo "name=$version_name"
            echo "track=$track"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate listing and committed assets
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.lane == 'play-store' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Play Store metadata and committed assets
        env:
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          args=(--root .)
          if [[ "$PUBLISH" == true ]]
          then
            args+=(--require-ready)
          fi
          node android/scripts/validate-play-store-metadata.mjs "${args[@]}"

  play-store:
    name: Build and publish signed Android App Bundle
    needs: [version, validate, local-server-libs]
    permissions:
      contents: read
    uses: pschmitt/ci-workflows/.github/workflows/play-store.yaml@main
    with:
      application-id: blue.anika.wolle
      artifact-label: stricknani
      project-directory: android
      keystore-file-name: stricknani-ci.jks
      unit-test-task: :app:testDebugUnitTest
      gradle-bundle-task: :app:bundleRelease
      aab-path: app/build/outputs/bundle/release/app-release.aab
      version-code: ${{ needs.version.outputs.code }}
      version-name: ${{ needs.version.outputs.name }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      track: ${{ needs.version.outputs.track }}
      status: ${{ github.event_name == 'workflow_dispatch' && inputs.release_status || 'completed' }}
      prebuilt-artifact: local-server-libs
      prebuilt-artifact-path: android/local-server-libs
    secrets: inherit
