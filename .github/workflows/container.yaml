name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image
        run: |
          set -Eeuo pipefail

          container_name="stricknani-test"
          health_url="http://127.0.0.1:7674/healthz"
          log_file="${RUNNER_TEMP}/stricknani-container.log"

          cleanup() {
            local status=$?

            if [[ "$status" -ne 0 ]] && docker container inspect "$container_name" >/dev/null 2>&1
            then
              printf '%s\n' 'Container logs:' >&2
              docker logs "$container_name" >&2 || true
              printf '%s\n' 'Container inspection:' >&2
              docker inspect "$container_name" >&2 || true
            fi

            docker rm --force --volumes "$container_name" >/dev/null 2>&1 || true
            return "$status"
          }

          trap cleanup EXIT

          docker run -d -p 7674:7674 --name stricknani-test \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e CSRF_SECRET_KEY="$(openssl rand -hex 32)" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline ))
          do
            if curl --fail --silent --show-error "$health_url" >"$log_file"
            then
              printf 'Container became ready: %s\n' "$health_url"
              exit 0
            fi

            if ! docker container inspect "$container_name" >/dev/null 2>&1
            then
              printf '%s\n' 'Container exited before becoming ready.' >&2
              exit 1
            fi

            sleep 2
          done

          printf 'Timed out waiting for %s after 60 seconds.\n' "$health_url" >&2
          printf 'Last health response:\n' >&2
          cat "$log_file" >&2 || true
          exit 1
