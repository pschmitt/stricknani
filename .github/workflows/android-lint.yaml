name: Android Lint

# The shared lint workflow owns ktfmt, the diff-patch diagnostic, Android Lint, and the report
# artifact. `project-directory` is required because Android lives below this repository's unrelated
# Python web application. Auto-fix PRs remain disabled here; this repository has not opted into
# workflow-authored formatting commits.
on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-lint.yaml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-lint.yaml'
  workflow_dispatch:

concurrency:
  # A newer push to a pull request supersedes this run (the pull request's
  # diff still covers every change). On main every run finishes: the next
  # push may not match this workflow's paths, so a cancelled run would leave
  # its commit unchecked. Manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: pschmitt/ci-workflows/.github/workflows/lint.yaml@main
    with:
      project-directory: android
      lint-baseline-path: ''
      enable-auto-fix: false
      # ktfmt runs from the root flake's `ktfmt` devShell (the shared workflow's default
      # `.#ktfmt`): the same nixpkgs binary as the pre-commit hook.
    secrets: inherit
    permissions:
      contents: read
