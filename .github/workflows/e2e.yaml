name: Web E2E

on:
  pull_request:
    paths:
      - ".github/workflows/e2e.yaml"
      - "justfile"
      - "pyproject.toml"
      - "scripts/e2e.sh"
      - "stricknani/**"
      - "tests/e2e/**"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      suite:
        description: Browser suite to run
        required: true
        default: full
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: web-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Chromium ${{ github.event_name == 'pull_request' && 'PR smoke' || inputs.suite }} suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install application dependencies
        run: just ci-setup-py

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Install pinned Tailwind CLI
        env:
          TAILWINDCSS_VERSION: 4.1.14
          TAILWINDCSS_SHA256: bc34c301b080b6e6b98ed24118419833f966f6f347e556945d6557d36a44a56e
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tailwindcss" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWINDCSS_VERSION}/tailwindcss-linux-x64"
          echo "${TAILWINDCSS_SHA256}  $RUNNER_TEMP/tailwindcss" | sha256sum --check
          chmod +x "$RUNNER_TEMP/tailwindcss"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build static CSS bundle
        run: just build-css

      - name: Run browser ${{ env.E2E_SUITE }} suite
        run: just e2e-${{ env.E2E_SUITE }}

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-${{ env.E2E_SUITE }}-artifacts
          path: e2e-artifacts/
          if-no-files-found: warn
