name: Test

on:
  push:
    branches: [ main, rust ]
    paths:
      - "rust/**"
      - "web/**"
      - "nix/**"
      - "ci/**"
      - "scripts/**"
      - "tests/**"
      - "stricknani/locales/**"
      - "pyproject.toml"
      - "justfile"
      - "biome.json"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "rust/**"
      - "web/**"
      - "nix/**"
      - "ci/**"
      - "scripts/**"
      - "tests/**"
      - "stricknani/locales/**"
      - "pyproject.toml"
      - "justfile"
      - "biome.json"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/test.yaml"

jobs:
  test-rust:
    name: Rust, web and tooling checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run Rust-first checks
        run: nix develop '.#rust' --command just check
