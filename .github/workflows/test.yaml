name: Test

on:
  push:
    branches: [ main ]
    paths:
      - "stricknani/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "stricknani/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/test.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: just ci-setup-py

      - name: Run tests with coverage
        run: just test

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  test-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Runs the suite inside the Nix devShell so the shellHook's
      # libstdc++ LD_LIBRARY_PATH export is exercised (prebuilt binary
      # wheels such as numpy/greenlet fail to load without it). Keep this as
      # a test-only parity lane: the primary Python 3.14 job above owns the
      # coverage gate, while coverage.py reports different line data under
      # the Nix Python runtime for the same passing test set.
      - name: Run tests in Nix devShell
        run: nix develop --command bash -c 'just ci-setup-py && uv run pytest -v'
