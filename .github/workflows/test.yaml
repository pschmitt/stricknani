name: Test

on:
  push:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "templates/**"
      - "examples/**"
      - "locales/**"
      - "web/**"
      - "nix/**"
      - "stricknani/locales/**"
      - "justfile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "templates/**"
      - "examples/**"
      - "locales/**"
      - "web/**"
      - "nix/**"
      - "stricknani/locales/**"
      - "justfile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/test.yaml"

concurrency:
  # A newer push to a pull request supersedes this run (the pull request's
  # diff still covers every change). On main every run finishes: the next
  # push may not match this workflow's paths, so a cancelled run would leave
  # its commit unchecked. Manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-rust:
    name: Server, web and tooling checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run project checks
        run: nix develop '.#rust' --command just check
