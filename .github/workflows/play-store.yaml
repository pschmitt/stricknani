name: Play Store Release

# Stable semantic-version tags publish a signed bundle to both the internal and closed (alpha)
# testing tracks in one upload, matching the fleet's other Android apps (syncwich/augh/jollyfin/
# nyetbox) - closed testing is the highest track this app is currently eligible for, so every
# tagged release goes out to both simultaneously. Delegates the actual build/publish to
# pschmitt/android-app-ci's reusable play-store.yaml, which additionally requires the repository
# variable PLAY_PUBLISH_ENABLED=true (already set - see android/docs/play-store-release.md) and a
# PLAY_SERVICE_ACCOUNT_JSON secret; a tag push safely fails loudly instead of silently publishing
# on a fresh checkout if either is ever missing. Local metadata validation (declarations,
# privacy-policy URL, committed listing assets) still runs before every build, tag-triggered or
# manual.
#
# Version resolution stays local, mirroring syncwich/augh/nyetbox: no baked-in incrementing
# default, so a real value has to be computed and passed on every run rather than leaving it to
# the shared workflow's own "use the app's default" behavior.

on:
  push:
    tags:
      - v*
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version_code:
        description: "Override versionCode (leave blank on a tag build to derive it from the tag)"
        required: false
        type: string
      version_name:
        description: "Override versionName (leave blank on a tag build to derive it from the tag)"
        required: false
        type: string
      track:
        description: "Play track(s), comma-separated (e.g. internal,alpha)"
        required: false
        default: "internal,alpha"
        type: string
      production_confirmation:
        description: "Required only when track includes production: type I_UNDERSTAND_PRODUCTION_UPLOAD"
        required: false
        default: ""
        type: string
      publish:
        description: "Upload the bundle to the requested Play track(s)"
        required: true
        default: false
        type: boolean

concurrency:
  group: play-store-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve release version and track
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.resolve.outputs.code }}
      name: ${{ steps.resolve.outputs.name }}
      track: ${{ steps.resolve.outputs.track }}
    steps:
      - name: Resolve release version and track
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_TRACK: ${{ inputs.track }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        shell: bash
        run: |
          if [[ -n "$INPUT_VERSION_CODE" || -n "$INPUT_VERSION_NAME" ]]; then
            version_code="$INPUT_VERSION_CODE"
            version_name="$INPUT_VERSION_NAME"
          elif [[ "$REF_NAME" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            # Keep version codes deterministic and monotonic for semantic-version tags.
            version_code=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
          else
            echo "Expected a semantic-version tag such as 1.0.0, or explicit version_code/version_name inputs" >&2
            exit 1
          fi
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }
          (( version_code <= 2100000000 )) || {
            echo "version_code exceeds Google Play's maximum" >&2
            exit 1
          }
          [[ "$version_name" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] || {
            echo "version_name contains unsupported characters" >&2
            exit 1
          }

          # Falls back to the fleet default even on a tag push, where inputs.track is unset
          # (workflow_dispatch inputs only populate for dispatch-triggered runs).
          track="${INPUT_TRACK:-internal,alpha}"
          [[ "$track" =~ ^(internal|alpha|beta|production)(,(internal|alpha|beta|production))*$ ]] || {
            echo "track must be a comma-separated list of internal, alpha, beta, and/or production" >&2
            exit 1
          }
          IFS=',' read -ra track_list <<< "$track"
          for t in "${track_list[@]}"; do
            if [[ "$t" == production && "$PRODUCTION_CONFIRMATION" != I_UNDERSTAND_PRODUCTION_UPLOAD ]]
            then
              echo "production requires the exact production_confirmation value" >&2
              exit 1
            fi
          done

          {
            echo "code=$version_code"
            echo "name=$version_name"
            echo "track=$track"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate listing and committed assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Play Store metadata and committed assets
        env:
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          args=(--root .)
          if [[ "$PUBLISH" == true ]]
          then
            args+=(--require-ready)
          fi
          python3 android/scripts/validate-play-store-metadata.py "${args[@]}"

  play-store:
    name: Build and publish signed Android App Bundle
    needs: [version, validate]
    uses: pschmitt/android-app-ci/.github/workflows/play-store.yaml@main
    with:
      application-id: blue.anika.wolle
      artifact-label: stricknani
      project-directory: android
      keystore-file-name: stricknani-ci.jks
      unit-test-task: :app:testDebugUnitTest
      gradle-bundle-task: :app:bundleRelease
      aab-path: app/build/outputs/bundle/release/app-release.aab
      version-code: ${{ needs.version.outputs.code }}
      version-name: ${{ needs.version.outputs.name }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      track: ${{ needs.version.outputs.track }}
    secrets: inherit
