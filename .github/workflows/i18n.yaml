name: i18n

on:
  push:
    branches: [ main, rust ]
    paths:
      - "stricknani/locales/**"
      - "src/**"
      - "locales/**"
      - "web/**"
      - "scripts/**"
      - "ci/tests/test_web_i18n.py"
      - "ci/tests/test_rust_i18n.py"
      - "babel.cfg"
      - "pyproject.toml"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/i18n.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "stricknani/locales/**"
      - "src/**"
      - "locales/**"
      - "web/**"
      - "scripts/**"
      - "ci/tests/test_web_i18n.py"
      - "ci/tests/test_rust_i18n.py"
      - "babel.cfg"
      - "pyproject.toml"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/i18n.yaml"

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check translations
        run: nix develop '.#tooling' --command just i18n-check
