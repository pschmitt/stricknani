name: i18n

on:
  push:
    branches: [ main ]
    paths:
      - "stricknani/locales/**"
      - "src/**"
      - "locales/**"
      - "web/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/i18n.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "stricknani/locales/**"
      - "src/**"
      - "locales/**"
      - "web/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/i18n.yaml"

concurrency:
  # A newer push to a pull request supersedes this run (the pull request's
  # diff still covers every change). On main every run finishes: the next
  # push may not match this workflow's paths, so a cancelled run would leave
  # its commit unchecked. Manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check translations
        run: nix develop '.#tooling' --command just i18n-check
