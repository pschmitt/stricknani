name: i18n

on:
  push:
    branches: [ main ]
    paths:
      - "stricknani/locales/**"
      - "src/**"
      - "locales/**"
      - "web/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/i18n.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "stricknani/locales/**"
      - "src/**"
      - "locales/**"
      - "web/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/i18n.yaml"

concurrency:
  # A newer push to the same branch or pull request supersedes this run;
  # manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check translations
        run: nix develop '.#tooling' --command just i18n-check
