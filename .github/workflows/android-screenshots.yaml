name: Android screenshots

# This lane is manual and review-only. It never uploads to a store. With open_pr=true, successful
# disposable captures are placed in a review PR using the shared screenshot-PR tail; merging that
# PR still does not upload anything until the separate, explicitly gated Play Store Assets workflow
# is dispatched. The fixture and artifact are disposable.
on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open or update a review PR with the captured Play Store screenshot buckets
        required: true
        default: false
        type: boolean

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: ${{ matrix.device }} / ${{ matrix.theme }} screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_2
            bucket: phoneScreenshots
            theme: light
            night_mode: no
          - device: tablet-7
            profile: Nexus 7
            bucket: sevenInchScreenshots
            theme: light
            night_mode: no
          - device: tablet-10
            profile: Nexus 10
            bucket: tenInchScreenshots
            theme: light
            night_mode: no
          - device: phone
            profile: pixel_2
            bucket: phoneScreenshots
            theme: dark
            night_mode: yes
          - device: tablet-7
            profile: Nexus 7
            bucket: sevenInchScreenshots
            theme: dark
            night_mode: yes
          - device: tablet-10
            profile: Nexus 10
            bucket: tenInchScreenshots
            theme: dark
            night_mode: yes
    env:
      COMPOSE_FILE: ci/stricknani/docker-compose.yml
      E2E_IMAGE: stricknani:screenshots
      SCREENSHOT_THEME: ${{ matrix.theme }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pschmitt/android-app-ci/.github/actions/setup-jdk-gradle@main

      - name: Build disposable Stricknani image
        run: docker build --tag "$E2E_IMAGE" .

      - name: Start disposable Stricknani fixture
        run: docker compose -f "$COMPOSE_FILE" up --detach --wait --wait-timeout 180

      - name: Seed deterministic fixture data and mint an API token
        run: |
          docker compose -f "$COMPOSE_FILE" exec -T stricknani \
            python -m stricknani.scripts.seed_demo --reset
          token="$(python3 ci/stricknani/seed.py --base-url http://127.0.0.1:7674)"
          echo "::add-mask::$token"
          printf 'E2E_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      # Build before booting the emulator: compiling while the emulator is starting makes the
      # tablet profiles especially likely to time out on GitHub-hosted runners.
      - name: Build debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
        working-directory: android

      - uses: pschmitt/android-app-ci/.github/actions/enable-kvm@main

      - name: Capture screenshots in ${{ matrix.device }} / ${{ env.SCREENSHOT_THEME }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: ${{ matrix.profile }}
          target: google_apis
          force-avd-creation: true
          emulator-boot-timeout: 1800
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: android
          script: |
            curl -fsSL https://raw.githubusercontent.com/pschmitt/android-app-ci/main/scripts/wait-for-android-emulator.sh | bash
            adb reverse tcp:7674 tcp:7674
            adb shell cmd uimode night "$NIGHT_MODE"
            ./scripts/run-screenshot-test.sh
        env:
          DEVICE: ${{ matrix.device }}
          NIGHT_MODE: ${{ matrix.night_mode }}

      - name: Collect screenshots and emulator diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p screenshot-captures
          adb pull /sdcard/Android/data/blue.anika.wolle.debug/files/screenshot-captures/. \
            screenshot-captures/ || true
          timeout 60s adb logcat -d > screenshot-logcat.txt || true
          timeout 20s adb exec-out screencap -p > screenshot-final-frame.png || true
          {
            echo '--- adb devices ---'
            timeout 10s adb devices -l
            echo '--- host memory ---'
            free -h
            echo '--- host disk ---'
            df -h
          } > screenshot-host-diagnostics.txt 2>&1 || true

      - name: Upload screenshot reports and artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-${{ matrix.device }}-${{ env.SCREENSHOT_THEME }}-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            screenshot-captures/
            screenshot-logcat.txt
            screenshot-final-frame.png
            screenshot-host-diagnostics.txt
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/

      # Keep the review-PR contract separate from diagnostics: the shared tail expects one clean
      # artifact per device bucket. The final-state frame is failure evidence, not a store asset,
      # and is deliberately excluded (Play permits at most eight screenshots per bucket).
      - name: Prepare Play Store screenshot bucket
        if: ${{ success() }}
        env:
          BUCKET: ${{ matrix.bucket }}
        run: |
          mkdir -p "play-store-screenshots/$BUCKET"
          shopt -s nullglob
          for image in screenshot-captures/*.png
          do
            [[ "$(basename "$image")" == *-final-state.png ]] && continue
            cp "$image" "play-store-screenshots/$BUCKET/"
          done

      - name: Upload Play Store screenshot bucket
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-${{ matrix.bucket }}-${{ env.SCREENSHOT_THEME }}-play-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: play-store-screenshots/${{ matrix.bucket }}/

      - name: Capture fixture logs on failure
        if: ${{ failure() }}
        run: docker compose -f "$COMPOSE_FILE" logs --no-color > screenshot-stricknani.log || true

      - name: Upload fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-${{ matrix.device }}-${{ env.SCREENSHOT_THEME }}-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: screenshot-stricknani.log

      - name: Tear down disposable Stricknani fixture
        if: ${{ always() }}
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans

  aggregate-play-store-screenshots:
    needs: capture
    if: ${{ !cancelled() && !failure() && inputs.open_pr }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download light and dark screenshot buckets
        uses: actions/download-artifact@v8
        with:
          pattern: stricknani-*-play-screenshots-${{ github.run_id }}
          path: play-store-inputs
          merge-multiple: true

      - name: Arrange screenshots in Fastlane metadata buckets
        run: |
          mkdir -p \
            fastlane/metadata/android/en-US/images/phoneScreenshots \
            fastlane/metadata/android/en-US/images/sevenInchScreenshots \
            fastlane/metadata/android/en-US/images/tenInchScreenshots
          while IFS= read -r -d '' image
          do
            basename="$(basename "$image")"
            # Keep the light set for Play: the workflow still captures dark mode for visual review,
            # but Play permits at most eight screenshots per device bucket and this journey has
            # eight named states. The dark captures remain in the per-job diagnostic artifacts.
            case "$basename" in
              *_dark-*)
                continue
                ;;
            esac
            case "$basename" in
              phone_*)
                bucket=phoneScreenshots
                ;;
              tablet-7_*)
                bucket=sevenInchScreenshots
                ;;
              tablet-10_*)
                bucket=tenInchScreenshots
                ;;
              *)
                echo "Unexpected screenshot filename: $basename" >&2
                exit 1
                ;;
            esac
            cp "$image" "fastlane/metadata/android/en-US/images/$bucket/$basename"
          done < <(find play-store-inputs -type f -name '*.png' -print0)
          python3 android/scripts/validate-play-store-metadata.py \
            --root . \
            --require-screenshots

      - name: Upload consolidated phone screenshot bucket
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-phone-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: fastlane/metadata/android/en-US/images/phoneScreenshots/

      - name: Upload consolidated 7-inch screenshot bucket
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-sevenInch-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots/

      - name: Upload consolidated 10-inch screenshot bucket
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-tenInch-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots/

  open-pr:
    needs: aggregate-play-store-screenshots
    if: ${{ !cancelled() && !failure() && inputs.open_pr }}
    uses: pschmitt/android-app-ci/.github/workflows/screenshots-open-pr.yaml@main
    with:
      artifact-label: stricknani
      commit-message: "chore: update Play Store screenshots (phone, 7in, 10in tablet)"
      pr-body-intro: "Merging this PR only stores reviewed assets in git; Play Console upload remains a separate gated workflow."
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
