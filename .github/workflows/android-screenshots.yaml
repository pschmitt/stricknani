name: Android screenshots

# This lane is manual and review-only. It never uploads to a store. With open_pr=true, successful
# disposable captures are placed in a review PR using the shared screenshot-PR tail; merging that
# PR still does not upload anything until the separate, explicitly gated Play Store Assets workflow
# is dispatched. The fixture and artifact are disposable.
on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open or update a review PR with the captured Play Store screenshot buckets
        required: true
        default: false
        type: boolean

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: ${{ matrix.device }} / ${{ matrix.theme }} screenshots
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_2
            bucket: phoneScreenshots
            theme: light
            night_mode: no
          - device: tablet-7
            profile: Nexus 7
            bucket: sevenInchScreenshots
            theme: light
            night_mode: no
          - device: tablet-10
            profile: Nexus 10
            bucket: tenInchScreenshots
            theme: light
            night_mode: no
          - device: phone
            profile: pixel_2
            bucket: phoneScreenshots
            theme: dark
            night_mode: yes
          - device: tablet-7
            profile: Nexus 7
            bucket: sevenInchScreenshots
            theme: dark
            night_mode: yes
          - device: tablet-10
            profile: Nexus 10
            bucket: tenInchScreenshots
            theme: dark
            night_mode: yes
    env:
      SCREENSHOT_THEME: ${{ matrix.theme }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The screenshots run against the same disposable native Rust fixture as the Android Rust E2E
      # lane; the former Python Docker image is not built on this branch any more.
      - name: Prepare private fixture paths
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'RUST_FIXTURE_FILE=%s/stricknani-screenshot-fixture.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUST_FIXTURE_STATE=%s/stricknani-screenshot-state.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUST_E2E_TOKEN_FILE=%s/stricknani-screenshot-token.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - uses: pschmitt/ci-workflows/.github/actions/setup-jdk-gradle@main

      # Build the server and both APKs before booting the emulator: compiling while the emulator
      # is starting makes the tablet profiles especially likely to time out on hosted runners.
      - name: Build Rust candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          nix build --no-link --print-out-paths '.#stricknani' > "$RUNNER_TEMP/rust-out-path"
          printf 'RUST_SERVER_BINARY=%s/bin/stricknani-server\n' "$(<"$RUNNER_TEMP/rust-out-path")" >> "$GITHUB_ENV"

      - name: Build debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
        working-directory: android

      - name: Start disposable native Rust fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix web run --silent fixture -- start \
            --binary "$RUST_SERVER_BINARY" \
            --temp-dir "$RUNNER_TEMP" \
            --fixture-file "$RUST_FIXTURE_FILE" \
            --state-file "$RUST_FIXTURE_STATE"

      - name: Seed screenshot records
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix web run --silent seed -- \
            --fixture-file "$RUST_FIXTURE_FILE" \
            --token-file "$RUST_E2E_TOKEN_FILE" \
            --screenshot-detail

      - name: Mask and export disposable API token and fixture port
        shell: bash
        run: |
          set -Eeuo pipefail
          node - "$RUST_E2E_TOKEN_FILE" "$RUST_FIXTURE_FILE" "$GITHUB_ENV" <<'JS'
          const { appendFileSync, readFileSync } = require("node:fs");

          const token = JSON.parse(readFileSync(process.argv[2], "utf8")).token;
          if (typeof token !== "string" || !token || /[\r\n]/.test(token)) {
            console.error("Rust screenshot token fixture is invalid");
            process.exit(1);
          }
          const url = new URL(JSON.parse(readFileSync(process.argv[3], "utf8")).url);
          if (
            url.protocol !== "http:" ||
            !["127.0.0.1", "localhost"].includes(url.hostname) ||
            !url.port
          ) {
            console.error("Rust fixture URL must be a loopback origin with a port");
            process.exit(1);
          }
          console.log(`::add-mask::${token}`);
          appendFileSync(process.argv[4], `E2E_TOKEN=${token}\nFIXTURE_PORT=${url.port}\n`);
          JS

      - uses: pschmitt/ci-workflows/.github/actions/enable-kvm@main

      - name: Capture screenshots in ${{ matrix.device }} / ${{ env.SCREENSHOT_THEME }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: ${{ matrix.profile }}
          target: google_apis
          force-avd-creation: true
          emulator-boot-timeout: 1800
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: android
          script: |
            curl -fsSL https://raw.githubusercontent.com/pschmitt/ci-workflows/main/scripts/wait-for-android-emulator.sh | bash
            adb reverse tcp:7674 "tcp:$FIXTURE_PORT"
            adb shell cmd uimode night "$NIGHT_MODE"
            ./scripts/run-screenshot-test.sh
        env:
          DEVICE: ${{ matrix.device }}
          NIGHT_MODE: ${{ matrix.night_mode }}

      - name: Collect screenshots and emulator diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p screenshot-captures
          adb pull /sdcard/Android/data/blue.anika.wolle.debug/files/screenshot-captures/. \
            screenshot-captures/ || true
          timeout 60s adb logcat -d > screenshot-logcat.txt || true
          timeout 20s adb exec-out screencap -p > screenshot-final-frame.png || true
          {
            echo '--- adb devices ---'
            timeout 10s adb devices -l
            echo '--- host memory ---'
            free -h
            echo '--- host disk ---'
            df -h
          } > screenshot-host-diagnostics.txt 2>&1 || true

      - name: Upload screenshot reports and artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-${{ matrix.device }}-${{ env.SCREENSHOT_THEME }}-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            screenshot-captures/
            screenshot-logcat.txt
            screenshot-final-frame.png
            screenshot-host-diagnostics.txt
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/

      # Keep the review-PR contract separate from diagnostics: the shared tail expects one clean
      # artifact per device bucket. The final-state frame is failure evidence, not a store asset,
      # and is deliberately excluded (Play permits at most eight screenshots per bucket).
      - name: Prepare Play Store screenshot bucket
        if: ${{ success() }}
        env:
          BUCKET: ${{ matrix.bucket }}
        run: |
          mkdir -p "play-store-screenshots/$BUCKET"
          shopt -s nullglob
          for image in screenshot-captures/*.png
          do
            basename="$(basename "$image")"
            # Onboarding and the Home-duplicating activity frame stay in diagnostics only.
            case "$basename" in
              *-final-state.png|*-onboarding.png|*-activity.png)
                continue
                ;;
            esac
            cp "$image" "play-store-screenshots/$BUCKET/"
          done

      - name: Upload Play Store screenshot bucket
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-${{ matrix.bucket }}-${{ env.SCREENSHOT_THEME }}-play-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: play-store-screenshots/${{ matrix.bucket }}/

      - name: Stop and remove disposable Rust fixture
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$RUST_FIXTURE_STATE" ]]; then
            npm --prefix web run --silent fixture -- stop --state-file "$RUST_FIXTURE_STATE" || true
          fi
          rm -f -- "$RUST_E2E_TOKEN_FILE" "$RUST_FIXTURE_FILE" "$RUST_FIXTURE_STATE"

  aggregate-play-store-screenshots:
    needs: capture
    if: ${{ !cancelled() && !failure() && inputs.open_pr }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download light and dark screenshot buckets
        uses: actions/download-artifact@v8
        with:
          pattern: stricknani-*-play-screenshots-${{ github.run_id }}
          path: play-store-inputs
          merge-multiple: true

      - name: Arrange screenshots in Fastlane metadata buckets
        run: |
          mkdir -p \
            fastlane/metadata/android/en-US/images/phoneScreenshots \
            fastlane/metadata/android/en-US/images/sevenInchScreenshots \
            fastlane/metadata/android/en-US/images/tenInchScreenshots
          while IFS= read -r -d '' image
          do
            basename="$(basename "$image")"
            # Keep the light set for Play: the workflow still captures dark mode for visual review,
            # but Play permits at most eight screenshots per device bucket and this journey has
            # eight named states. The dark captures remain in the per-job diagnostic artifacts.
            case "$basename" in
              *_dark-*)
                continue
                ;;
            esac
            case "$basename" in
              phone_*)
                bucket=phoneScreenshots
                ;;
              tablet-7_*)
                bucket=sevenInchScreenshots
                ;;
              tablet-10_*)
                bucket=tenInchScreenshots
                ;;
              *)
                echo "Unexpected screenshot filename: $basename" >&2
                exit 1
                ;;
            esac
            cp "$image" "fastlane/metadata/android/en-US/images/$bucket/$basename"
          done < <(find play-store-inputs -type f -name '*.png' -print0)
          node android/scripts/validate-play-store-metadata.mjs \
            --root . \
            --require-screenshots

      - name: Upload consolidated phone screenshot bucket
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-phone-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: fastlane/metadata/android/en-US/images/phoneScreenshots/

      - name: Upload consolidated 7-inch screenshot bucket
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-sevenInch-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots/

      - name: Upload consolidated 10-inch screenshot bucket
        uses: actions/upload-artifact@v7
        with:
          name: stricknani-tenInch-screenshots-${{ github.run_id }}
          if-no-files-found: error
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots/

  open-pr:
    needs: aggregate-play-store-screenshots
    if: ${{ !cancelled() && !failure() && inputs.open_pr }}
    uses: pschmitt/ci-workflows/.github/workflows/screenshots-open-pr.yaml@main
    with:
      artifact-label: stricknani
      commit-message: "chore: update Play Store screenshots (phone, 7in, 10in tablet)"
      pr-body-intro: "Merging this PR only stores reviewed assets in git; Play Console upload remains a separate gated workflow."
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
