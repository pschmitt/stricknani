name: Android Build

# The shared build workflow owns the checkout, JDK/Gradle setup, unit test, ABI APK build, and
# artifact contract. `project-directory` is required because Android lives below this repository's
# unrelated Python web application.
on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yaml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yaml'
  workflow_dispatch:

concurrency:
  # A newer push to a pull request supersedes this run (the pull request's
  # diff still covers every change). On main every run finishes: the next
  # push may not match this workflow's paths, so a cancelled run would leave
  # its commit unchecked. Manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assemble:
    uses: pschmitt/ci-workflows/.github/workflows/build.yaml@main
    with:
      project-directory: android
      unit-test-task: :app:testDebugUnitTest
      gradle-task: :app:assembleDebug
      apk-dir: app/build/outputs/apk/debug
      artifact-prefix: app
      compute-version-name: true
    secrets: inherit
    permissions:
      contents: read
