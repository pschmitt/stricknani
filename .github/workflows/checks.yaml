name: Checks

# Lint and test in one workflow; each job runs only when its files change.
# - project: full-repository web/tooling and catalog checks. Rust formatting,
#   strict Clippy, all-target tests and production builds belong to Build's
#   cached Nix graph, so this workflow does not compile them again.
# - nix-lint and android-lint: the shared ci-workflows lint workflows.
on:
  push:
    branches: [main]
    paths: &paths
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "templates/**"
      - "examples/**"
      - "locales/**"
      - "web/**"
      - "nix/**"
      - "stricknani/locales/**"
      - "justfile"
      - "flake.nix"
      - "flake.lock"
      - "ci/**"
      - "**.nix"
      - "android/**"
      - ".github/workflows/checks.yaml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  # A newer push to a pull request supersedes this run (the pull request's
  # diff still covers every change). On main every run finishes: the next
  # push may not match a job's paths, so a cancelled run would leave its
  # commit unchecked. Manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which jobs this change needs; a manual dispatch runs them all.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      project: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.project == 'true' }}
      nix: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.nix == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On main, compare against the last commit this workflow passed on, not just the previous
      # push: a run GitHub replaced in the queue (or one that failed) must not leave its commit's
      # changes untested. Without such a run, paths-filter falls back to the previous push.
      - id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_file="${WORKFLOW_REF%@*}"
          workflow_file="${workflow_file##*/}"
          sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=${GITHUB_REF_NAME}&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [[ -n "$sha" ]] && git merge-base --is-ancestor "$sha" HEAD
          then
            printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
            printf 'Comparing with the last passed run: %s\n' "$sha"
          else
            printf '%s\n' 'No passed run on this branch; comparing with the previous push.'
          fi
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            project:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'templates/**'
              - 'examples/**'
              - 'locales/**'
              - 'web/**'
              - 'nix/**'
              - 'stricknani/locales/**'
              - 'justfile'
              - 'flake.nix'
              - 'flake.lock'
              - 'ci/**'
              - '.github/workflows/checks.yaml'
            nix:
              - '**.nix'
              - 'flake.lock'
              - '.github/workflows/checks.yaml'
            android:
              - 'android/**'
              - '.github/workflows/checks.yaml'

  project:
    needs: changes
    if: ${{ needs.changes.outputs.project == 'true' }}
    name: Server, web and tooling checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run web and catalog checks
        run: nix develop '.#tooling' --command just web-check web-test i18n-check

      - name: Verify CI artifact handoff and retries
        run: nix develop '.#tooling' --command node --test ci/wait-for-nix-producer.test.mjs

  nix-lint:
    needs: changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    uses: pschmitt/ci-workflows/.github/workflows/nix-lint.yaml@main

  # The shared lint workflow owns ktfmt, the diff-patch diagnostic, Android
  # Lint and the report artifact; Android lives in android/. Auto-fix PRs stay
  # off: this repository has not opted into workflow-authored commits.
  android-lint:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    uses: pschmitt/ci-workflows/.github/workflows/lint.yaml@main
    with:
      project-directory: android
      lint-baseline-path: ""
      enable-auto-fix: false
      # ktfmt runs from the root flake's `ktfmt` devShell (the shared workflow's default
      # `.#ktfmt`): the same nixpkgs binary as the pre-commit hook.
    secrets: inherit
    permissions:
      contents: read
