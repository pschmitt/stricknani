name: Android Rust E2E

on:
  push:
    branches:
      - rust
    paths:
      - "android/**"
      - "ci/stricknani/**"
      - "rust/**"
      - "nix/rust-package.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/android-rust-e2e.yaml"
  workflow_dispatch:
    inputs:
      lane:
        description: Instrumentation journey to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: android-rust-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Rust server + Android emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      E2E_LANE: ${{ github.event_name == 'push' && 'smoke' || inputs.lane }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare private fixture paths
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'RUST_FIXTURE_FILE=%s/stricknani-rust-e2e-fixture.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUST_FIXTURE_STATE=%s/stricknani-rust-e2e-state.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUST_E2E_TOKEN_FILE=%s/stricknani-rust-e2e-token.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Android SDK and Gradle
        uses: pschmitt/ci-workflows/.github/actions/setup-jdk-gradle@main

      # Compile the Rust candidate and both APKs before emulator startup.
      - name: Build Rust candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          nix build --no-link --print-out-paths '.#stricknani-rust' > "$RUNNER_TEMP/rust-out-path"
          printf 'RUST_SERVER_BINARY=%s/bin/stricknani-server\n' "$(<"$RUNNER_TEMP/rust-out-path")" >> "$GITHUB_ENV"

      - name: Build debug and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
        working-directory: android

      - name: Start disposable native Rust fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m ci.stricknani.rust_fixture start \
            --binary "$RUST_SERVER_BINARY" \
            --temp-dir "$RUNNER_TEMP" \
            --fixture-file "$RUST_FIXTURE_FILE" \
            --state-file "$RUST_FIXTURE_STATE"

      - name: Seed Android E2E records
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m ci.stricknani.seed_rust \
            --fixture-file "$RUST_FIXTURE_FILE" \
            --token-file "$RUST_E2E_TOKEN_FILE"

      # This disposable PAT is masked before the existing script passes it to Gradle.
      - name: Mask and export disposable API token
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUST_E2E_TOKEN_FILE" "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path

          fixture = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          token = fixture.get("token") if isinstance(fixture, dict) else None
          if not isinstance(token, str) or not token or "\n" in token or "\r" in token:
              raise SystemExit("Rust E2E token fixture is invalid")
          print(f"::add-mask::{token}", flush=True)
          with Path(sys.argv[2]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"E2E_TOKEN={token}\n")
          PY

      - name: Read native fixture port
        shell: bash
        run: |
          set -Eeuo pipefail
          port="$(python3 - "$RUST_FIXTURE_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          fixture = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          parsed = urlsplit(fixture["url"])
          if (
              parsed.scheme != "http"
              or parsed.hostname not in {"127.0.0.1", "localhost"}
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port is None
              or parsed.path
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("Rust fixture URL must be a loopback origin with a port")
          print(parsed.port)
          PY
          )"
          printf 'RUST_FIXTURE_PORT=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Enable KVM
        uses: pschmitt/ci-workflows/.github/actions/enable-kvm@main

      - name: Run existing Android journeys against Rust
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: google_apis
          force-avd-creation: true
          emulator-boot-timeout: 1800
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: android
          script: bash ../ci/stricknani/run-rust-e2e-ci.sh

      - name: Summarize Android instrumentation failures
        if: ${{ failure() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m ci.stricknani.summarize_rust_e2e \
            --results-dir android/app/build/outputs/androidTest-results/connected/debug \
            --fixture-file "$RUST_FIXTURE_FILE" \
            --token-file "$RUST_E2E_TOKEN_FILE"

      - name: Stop and remove disposable Rust fixture
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$RUST_FIXTURE_STATE" ]]; then
            python3 -m ci.stricknani.rust_fixture stop --state-file "$RUST_FIXTURE_STATE" || true
          fi
          rm -f -- "$RUST_E2E_TOKEN_FILE" "$RUST_FIXTURE_FILE" "$RUST_FIXTURE_STATE"
