name: Android E2E

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "web/e2e/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "ci/run-rust-*.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "templates/**"
      - "examples/**"
      - "locales/**"
      - "nix/rust-package.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/android-rust-e2e.yaml"
  pull_request:
    paths:
      - "android/**"
      - "web/e2e/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "ci/run-rust-*.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "templates/**"
      - "examples/**"
      - "locales/**"
      - "nix/rust-package.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/android-rust-e2e.yaml"
  workflow_dispatch:
    inputs:
      lane:
        description: Instrumentation journey to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  # A newer push to a pull request supersedes this run (the pull request's
  # diff still covers every change). On main every run finishes: the next
  # push may not match this workflow's paths, so a cancelled run would leave
  # its commit unchecked. Manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Server + Android emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      E2E_LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'smoke' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare private fixture paths
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'RUST_FIXTURE_FILE=%s/stricknani-rust-e2e-fixture.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUST_FIXTURE_STATE=%s/stricknani-rust-e2e-state.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUST_E2E_TOKEN_FILE=%s/stricknani-rust-e2e-token.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Android SDK and Gradle
        uses: pschmitt/ci-workflows/.github/actions/setup-jdk-gradle@main

      # Compile the Rust candidate and both APKs before emulator startup.
      - name: Build server
        shell: bash
        run: |
          set -Eeuo pipefail
          nix build --no-link --print-out-paths '.#stricknani' > "$RUNNER_TEMP/rust-out-path"
          printf 'RUST_SERVER_BINARY=%s/bin/stricknani-server\n' "$(<"$RUNNER_TEMP/rust-out-path")" >> "$GITHUB_ENV"

      - name: Build debug and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
        working-directory: android

      - name: Start disposable server fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix web run --silent fixture -- start \
            --binary "$RUST_SERVER_BINARY" \
            --temp-dir "$RUNNER_TEMP" \
            --fixture-file "$RUST_FIXTURE_FILE" \
            --state-file "$RUST_FIXTURE_STATE"

      - name: Seed Android E2E records
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix web run --silent seed -- \
            --fixture-file "$RUST_FIXTURE_FILE" \
            --token-file "$RUST_E2E_TOKEN_FILE"

      # This disposable PAT is masked before the existing script passes it to Gradle.
      - name: Mask and export disposable API token
        shell: bash
        run: |
          set -Eeuo pipefail
          node - "$RUST_E2E_TOKEN_FILE" "$GITHUB_ENV" <<'JS'
          const { appendFileSync, readFileSync } = require("node:fs");

          const fixture = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const token = fixture !== null && typeof fixture === "object" ? fixture.token : undefined;
          if (typeof token !== "string" || !token || /[\r\n]/.test(token)) {
            console.error("Android E2E token fixture is invalid");
            process.exit(1);
          }
          console.log(`::add-mask::${token}`);
          appendFileSync(process.argv[3], `E2E_TOKEN=${token}\n`);
          JS

      - name: Read native fixture port
        shell: bash
        run: |
          set -Eeuo pipefail
          port="$(node - "$RUST_FIXTURE_FILE" <<'JS'
          const { readFileSync } = require("node:fs");

          const fixture = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const parsed = new URL(fixture.url);
          if (
            parsed.protocol !== "http:" ||
            !["127.0.0.1", "localhost"].includes(parsed.hostname) ||
            parsed.username ||
            parsed.password ||
            !parsed.port ||
            parsed.pathname !== "/" ||
            parsed.search ||
            parsed.hash
          ) {
            console.error("Rust fixture URL must be a loopback origin with a port");
            process.exit(1);
          }
          console.log(parsed.port);
          JS
          )"
          printf 'RUST_FIXTURE_PORT=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Enable KVM
        uses: pschmitt/ci-workflows/.github/actions/enable-kvm@main

      - name: Run Android journeys
        # The journeys take a few minutes. The emulator action can hang while shutting the
        # emulator down after they pass (seen 2026-11-06); fail fast so a rerun is cheap instead
        # of waiting for the 90-minute job timeout.
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: google_apis
          force-avd-creation: true
          emulator-boot-timeout: 1800
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: android
          script: bash ../ci/run-rust-e2e-ci.sh

      - name: Summarize Android instrumentation failures
        if: ${{ failure() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix web run --silent summarize-e2e -- \
            --results-dir "$GITHUB_WORKSPACE/android/app/build/outputs/androidTest-results/connected/debug" \
            --fixture-file "$RUST_FIXTURE_FILE" \
            --token-file "$RUST_E2E_TOKEN_FILE"

      - name: Stop and remove server fixture
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$RUST_FIXTURE_STATE" ]]; then
            npm --prefix web run --silent fixture -- stop --state-file "$RUST_FIXTURE_STATE" || true
          fi
          rm -f -- "$RUST_E2E_TOKEN_FILE" "$RUST_FIXTURE_FILE" "$RUST_FIXTURE_STATE"
