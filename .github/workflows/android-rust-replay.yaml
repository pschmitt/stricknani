name: Android Replay

on:
  push:
    branches:
    paths:
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "templates/**"
      - "examples/**"
      - "locales/**"
      - "web/e2e/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "ci/run-rust-*.sh"
      - "nix/rust-package.nix"
      - "docs/rust-replay-ci.md"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/android-rust-replay.yaml"
  workflow_dispatch:

concurrency:
  # A newer push to the same branch or pull request supersedes this run;
  # manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    name: Server and Android Room replay
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Android SDK and Gradle
        uses: pschmitt/ci-workflows/.github/actions/setup-jdk-gradle@main

      - name: Build server
        id: rust
        shell: bash
        run: |
          set -Eeuo pipefail
          nix build --no-link --print-out-paths '.#stricknani' > "$RUNNER_TEMP/rust-out-path"
          printf 'binary=%s/bin/stricknani-server\n' "$(<"$RUNNER_TEMP/rust-out-path")" >> "$GITHUB_OUTPUT"

      # Keep Gradle away from the emulator's CPU and memory during boot and tests.
      - name: Build x86_64 debug and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
        working-directory: android

      - name: Start disposable server fixture
        shell: bash
        env:
          RUST_SERVER_BINARY: ${{ steps.rust.outputs.binary }}
        run: |
          set -Eeuo pipefail
          npm --prefix web run --silent fixture -- start \
            --binary "$RUST_SERVER_BINARY" \
            --temp-dir "$RUNNER_TEMP" \
            --fixture-file "$RUNNER_TEMP/stricknani-rust-fixture.json" \
            --state-file "$RUNNER_TEMP/stricknani-rust-fixture-state.json"

      - name: Enable KVM
        uses: pschmitt/ci-workflows/.github/actions/enable-kvm@main

      - name: Run Room replay on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: google_apis
          force-avd-creation: true
          emulator-boot-timeout: 1800
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: android
          script: bash ../ci/run-rust-replay-ci.sh

      - name: Stop and remove server fixture
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$RUNNER_TEMP/stricknani-rust-fixture-state.json" ]]; then
            npm --prefix web run --silent fixture -- stop \
              --state-file "$RUNNER_TEMP/stricknani-rust-fixture-state.json" || true
          fi

      - name: Upload sanitized replay failure log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-rust-replay-failure-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/rust-replay-sanitized.log
