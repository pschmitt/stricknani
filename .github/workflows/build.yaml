name: Build

# Run every lane and let Nix substitute unchanged derivations from the S3 cache.
# Native producers finish before their checks; E2E can consume the amd64 producer
# while validation continues. Container publication waits for all native gates.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nix:
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-build.yaml@main
    with:
      pin-prefix: gh-stricknani-main
      image-package: stricknani-docker
      image-artifact: nix-container-amd64
      image-archive-file: stricknani-image.tar.gz
      producer-metadata-artifact: nix-producer-metadata
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  nix-checks:
    needs: nix
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-checks.yaml@main
    with:
      pin-prefix: gh-stricknani-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  nix-aarch64:
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-build.yaml@main
    with:
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      pin-prefix: gh-stricknani-main
      image-package: stricknani-docker
      image-artifact: nix-container-arm64
      image-archive-file: stricknani-image.tar.gz
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  nix-aarch64-checks:
    needs: nix-aarch64
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-checks.yaml@main
    with:
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      full-flake-check: false
      pin-prefix: gh-stricknani-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  publish-container:
    name: Publish container
    needs: [nix, nix-checks, nix-aarch64, nix-aarch64-checks]
    permissions:
      contents: read
      packages: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-image.yaml@main
    with:
      image-name: ghcr.io/pschmitt/stricknani
      platforms: linux/amd64,linux/arm64
      prebuilt-artifacts: '{"linux/amd64":"nix-container-amd64","linux/arm64":"nix-container-arm64"}'
      archive-file: stricknani-image.tar.gz
      test-script: ci/verify-container.sh
      publish: ${{ github.event_name != 'pull_request' }}

  android:
    uses: pschmitt/ci-workflows/.github/workflows/build.yaml@main
    with:
      project-directory: android
      unit-test-task: :app:testDebugUnitTest
      gradle-task: :app:assembleDebug
      apk-dir: app/build/outputs/apk/debug
      artifact-prefix: app
      compute-version-name: true
    secrets: inherit
    permissions:
      contents: read
