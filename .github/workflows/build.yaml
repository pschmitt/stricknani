name: Build

# Nix produces the shared outputs before container publication, E2E and the
# rolling release consume them. Main runs always produce release artifacts;
# pull requests retain file filters.
# - nix and nix-aarch64: flake check, packages and the Nix server image
#   (x86_64 also builds on nixbot), aarch64 natively, pushed to niks3.
# - docker: loads the Nix image artifact, probes /healthz, then pushes to GHCR.
# - android: unit tests and the debug APKs (shared ci-workflows build).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "templates/**"
      - "examples/**"
      - "locales/**"
      - "stricknani/locales/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - "android/**"
      - "ci/run-*.sh"
      - "ci/verify-container.sh"
      - "docs/web-v2-contract.md"
      - "docs/rust-replay-ci.md"
      - ".github/workflows/build.yaml"
      - ".github/workflows/e2e.yaml"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

concurrency:
  # A newer push to a pull request supersedes this run (the pull request's
  # diff still covers every change). On main every run finishes: the next
  # push may not match a job's paths, so a cancelled run would leave its
  # commit unchecked. Manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which jobs this change needs; a manual dispatch runs them all.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.nix == 'true' }}
      docker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On main, compare against the last commit this workflow passed on, not just the previous
      # push: a run GitHub replaced in the queue (or one that failed) must not leave its commit's
      # changes untested. Without such a run, paths-filter falls back to the previous push.
      - id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_file="${WORKFLOW_REF%@*}"
          workflow_file="${workflow_file##*/}"
          sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=${GITHUB_REF_NAME}&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [[ -n "$sha" ]] && git merge-base --is-ancestor "$sha" HEAD
          then
            printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
            printf 'Comparing with the last passed run: %s\n' "$sha"
          else
            printf '%s\n' 'No passed run on this branch; comparing with the previous push.'
          fi
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            nix:
              - 'web/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'templates/**'
              - 'examples/**'
              - 'locales/**'
              - 'nix/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'justfile'
              - '.github/workflows/build.yaml'
              - '.github/workflows/e2e.yaml'
              - '.github/workflows/release.yaml'
            docker:
              - 'ci/verify-container.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'templates/**'
              - 'examples/**'
              - 'locales/**'
              - 'web/**'
              - 'nix/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/build.yaml'
            android:
              - 'android/**'
              - '.github/workflows/build.yaml'

  nix:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.nix == 'true' || needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      # Substitutes what nixbot, the build hosts and the E2E server job pushed to niks3
      # (crane's dependency build above all), and pushes the server back below.
      - name: Install Nix with the niks3 cache
        uses: pschmitt/ci-workflows/.github/actions/nix-niks3@main
        with:
          s3-store: ${{ secrets.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
          extra-conf: |
            nix-path = nixpkgs=channel:nixos-unstable

      - name: Run nix flake check
        run: nix flake check

      - name: Build shared packages, dependencies and the container
        id: built
        shell: bash
        run: |
          set -Eeuo pipefail
          nix build --out-link result \
            '.#stricknani' '.#stricknani-web' '.#stricknani-server-static' \
            '.#stricknani-docker' '.#stricknani.cargoArtifacts' \
            '.#stricknani-server-static.cargoArtifacts'
          # Each root is realised once above; later jobs consume these outputs.
          cp --dereference result-3 "$RUNNER_TEMP/stricknani-image.tar.gz"
          {
            echo "paths<<EOF"
            printf 'stricknani %s\n' "$(readlink -f result)"
            printf 'stricknani-web %s\n' "$(readlink -f result-1)"
            printf 'stricknani-server-static %s\n' "$(readlink -f result-2)"
            printf 'stricknani-docker %s\n' "$(readlink -f result-3)"
            printf 'stricknani-cargoArtifacts %s\n' "$(readlink -f result-4)"
            printf 'stricknani-static-cargoArtifacts %s\n' "$(readlink -f result-5)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push to the niks3 cache
        uses: pschmitt/ci-workflows/.github/actions/niks3-push@main
        with:
          paths: ${{ steps.built.outputs.paths }}
          pin-prefix: gh-stricknani-main
          server-url: ${{ vars.NIKS3_SERVER_URL }}

      - name: Upload the Nix container for verification and publishing
        uses: actions/upload-artifact@v7
        with:
          name: nix-container
          path: ${{ runner.temp }}/stricknani-image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # aarch64-linux packages and checks, built natively on GitHub's arm runners
  # (nixbot on x86_64 would have to emulate them) and pushed to the niks3 S3
  # cache from main and pull requests (the server only trusts those refs); see
  # pschmitt/ci-workflows. Nothing here needs KVM.

  nix-aarch64:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.nix == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-aarch64.yaml@main
    with:
      pin-prefix: gh-stricknani-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  docker:
    needs: [changes, nix]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-image.yaml@main
    with:
      image-name: ghcr.io/pschmitt/stricknani
      prebuilt-artifact: nix-container
      archive-file: stricknani-image.tar.gz
      test-script: ci/verify-container.sh
      publish: ${{ github.event_name != 'pull_request' }}

  android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    uses: pschmitt/ci-workflows/.github/workflows/build.yaml@main
    with:
      project-directory: android
      unit-test-task: :app:testDebugUnitTest
      gradle-task: :app:assembleDebug
      apk-dir: app/build/outputs/apk/debug
      artifact-prefix: app
      compute-version-name: true
    secrets: inherit
    permissions:
      contents: read

  e2e:
    needs: [nix]
    if: ${{ !cancelled() && (needs.nix.result == 'success' || needs.nix.result == 'skipped') }}
    uses: ./.github/workflows/e2e.yaml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write

  release:
    needs: [nix, nix-aarch64]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.nix.result == 'success' && needs.nix-aarch64.result == 'success' }}
    uses: ./.github/workflows/release.yaml
    secrets: inherit
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
