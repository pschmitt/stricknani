name: Build
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.circus_pr_number != '' && format('Circus PR artifacts {0}', inputs.circus_pr_sha) || (github.event_name == 'status' && github.event.context == 'circus/artifacts' && github.event.state == 'success' && github.event.sha == github.sha && 'Circus artifacts ready' || 'Build') }}

# Main consumes the exact commit's Circus outputs once they reach the S3 cache.
# Circus builds both architectures for pull requests and dispatches cache-only consumers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      circus_pr_number:
        description: Trusted Circus PR number
        type: string
        required: false
      circus_pr_sha:
        description: Exact trusted Circus PR head
        type: string
        required: false
  status:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.circus_pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nix:
    if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' && (github.event_name != 'status' || (github.event.context == 'circus/artifacts' && github.event.state == 'success' && github.event.sha == github.sha)) }}
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-build.yaml@main
    with:
      circus-cache-only: ${{ github.event_name == 'status' || (github.event_name == 'workflow_dispatch' && inputs.circus_pr_number != '') }}
      circus-pr-number: ${{ inputs.circus_pr_number || '' }}
      circus-pr-sha: ${{ inputs.circus_pr_sha || '' }}
      pin-prefix: gh-stricknani-main
      image-package: stricknani-docker
      image-artifact: nix-container-amd64
      image-archive-file: stricknani-image.tar.gz
      producer-metadata-artifact: nix-producer-metadata
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  nix-checks:
    needs: nix
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-checks.yaml@main
    with:
      circus-cache-only: ${{ github.event_name == 'status' || (github.event_name == 'workflow_dispatch' && inputs.circus_pr_number != '') }}
      circus-pr-number: ${{ inputs.circus_pr_number || '' }}
      circus-pr-sha: ${{ inputs.circus_pr_sha || '' }}
      pin-prefix: gh-stricknani-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  nix-aarch64:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.circus_pr_number == '') || (github.event_name == 'status' && github.event.context == 'circus/artifacts' && github.event.state == 'success' && github.event.sha == github.sha) }}
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-build.yaml@main
    with:
      circus-cache-only: ${{ github.event_name == 'status' }}
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      pin-prefix: gh-stricknani-main
      image-package: stricknani-docker
      image-artifact: nix-container-arm64
      image-archive-file: stricknani-image.tar.gz
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  nix-aarch64-checks:
    needs: nix-aarch64
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-checks.yaml@main
    with:
      circus-cache-only: ${{ github.event_name == 'status' }}
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      full-flake-check: false
      pin-prefix: gh-stricknani-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  publish-container:
    name: Publish container
    needs: [nix, nix-checks, nix-aarch64, nix-aarch64-checks]
    permissions:
      contents: read
      packages: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-image.yaml@main
    with:
      image-name: ghcr.io/pschmitt/stricknani
      platforms: linux/amd64,linux/arm64
      prebuilt-artifacts: '{"linux/amd64":"nix-container-amd64","linux/arm64":"nix-container-arm64"}'
      archive-file: stricknani-image.tar.gz
      test-script: ci/verify-container.sh
      publish: ${{ github.event_name != 'pull_request' }}

  test-container-pr:
    name: Test container
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.circus_pr_number != '' }}
    needs: [nix, nix-checks]
    permissions:
      contents: read
      packages: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-image.yaml@main
    with:
      image-name: ghcr.io/pschmitt/stricknani
      platforms: linux/amd64
      prebuilt-artifact: nix-container-amd64
      archive-file: stricknani-image.tar.gz
      test-script: ci/verify-container.sh
      source-ref: ${{ inputs.circus_pr_number != '' && inputs.circus_pr_sha || github.sha }}
      publish: false

  android:
    if: ${{ github.event_name != 'status' && (github.event_name != 'workflow_dispatch' || inputs.circus_pr_number == '') }}
    uses: pschmitt/ci-workflows/.github/workflows/build.yaml@main
    with:
      project-directory: android
      unit-test-task: :app:testDebugUnitTest
      gradle-task: :app:assembleDebug
      apk-dir: app/build/outputs/apk/debug
      artifact-prefix: app
      compute-version-name: true
    secrets: inherit
    permissions:
      contents: read
