name: Build

# Every build in one workflow; each job runs only when its files change.
# - nix and nix-aarch64: flake check, packages and the Nix server image
#   (x86_64 also builds on nixbot), aarch64 natively, pushed to niks3.
# - docker: the Dockerfile image, pushed to GHCR and probed on /healthz.
# - android: unit tests and the debug APKs (shared ci-workflows build).
on:
  push:
    branches: [main]
    paths: &paths
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "templates/**"
      - "examples/**"
      - "locales/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "Dockerfile"
      - "justfile"
      - ".dockerignore"
      - "android/**"
      - ".github/workflows/build.yaml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  # A newer push to a pull request supersedes this run (the pull request's
  # diff still covers every change). On main every run finishes: the next
  # push may not match a job's paths, so a cancelled run would leave its
  # commit unchecked. Manual dispatches keep their own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Which jobs this change needs; a manual dispatch runs them all.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.nix == 'true' }}
      docker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            nix:
              - 'web/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'templates/**'
              - 'examples/**'
              - 'locales/**'
              - 'nix/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'Dockerfile'
              - 'justfile'
              - '.github/workflows/build.yaml'
            docker:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'templates/**'
              - 'examples/**'
              - 'locales/**'
              - 'web/**'
              - 'nix/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.dockerignore'
              - 'Dockerfile'
              - '.github/workflows/build.yaml'
            android:
              - 'android/**'
              - '.github/workflows/build.yaml'

  nix:
    needs: changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run nix flake check
        run: nix flake check

      - name: Build with Nix
        run: just build-nix

      - name: Build Nix container
        run: just build-container

      - name: Build server image
        run: nix build '.#stricknani-docker' --out-link result-rust-image

      - name: Verify server image
        run: |
          set -Eeuo pipefail

          image_name="ghcr.io/pschmitt/stricknani:latest"
          container_name="stricknani-image-test"
          health_url="http://127.0.0.1:7674/healthz"

          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker load < result-rust-image
          docker run --detach --publish 7674:7674 --name "$container_name" \
            --env STRICKNANI_DATABASE_URL=sqlite::memory: \
            --env STRICKNANI_MEDIA_ROOT=/tmp/stricknani-media \
            --env TRUSTED_HOSTS=127.0.0.1,localhost \
            --env SESSION_COOKIE_SECURE=true \
            "$image_name"

          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            if curl --fail --silent --show-error "$health_url"; then
              exit 0
            fi

            if ! docker container inspect "$container_name" >/dev/null 2>&1; then
              printf '%s\n' 'Rust candidate container exited before becoming ready.' >&2
              exit 1
            fi

            sleep 2
          done

          printf 'Timed out waiting for %s after 60 seconds.\n' "$health_url" >&2
          docker logs "$container_name" >&2 || true
          exit 1

  # aarch64-linux packages and checks, built natively on GitHub's arm runners
  # (nixbot on x86_64 would have to emulate them) and pushed to the niks3 S3
  # cache from main and pull requests (the server only trusts those refs); see
  # pschmitt/ci-workflows. Nothing here needs KVM.

  nix-aarch64:
    needs: changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-aarch64.yaml@main
    with:
      pin-prefix: gh-stricknani-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  docker:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image
        run: |
          set -Eeuo pipefail

          container_name="stricknani-test"
          health_url="http://127.0.0.1:7674/healthz"
          log_file="${RUNNER_TEMP}/stricknani-container.log"

          cleanup() {
            local status=$?

            if [[ "$status" -ne 0 ]] && docker container inspect "$container_name" >/dev/null 2>&1
            then
              printf '%s\n' 'Container logs:' >&2
              docker logs "$container_name" >&2 || true
              printf '%s\n' 'Container inspection:' >&2
              docker inspect "$container_name" >&2 || true
            fi

            docker rm --force --volumes "$container_name" >/dev/null 2>&1 || true
            return "$status"
          }

          trap cleanup EXIT

          docker run -d -p 127.0.0.1:7674:7674 --name stricknani-test \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /var/lib/stricknani:rw,uid=65532,gid=65532,mode=0750 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline ))
          do
            if curl --fail --silent --show-error --header 'Host: localhost' \
              "$health_url" >"$log_file"
            then
              printf 'Container became ready: %s\n' "$health_url"
              exit 0
            fi

            if ! docker container inspect "$container_name" >/dev/null 2>&1
            then
              printf '%s\n' 'Container exited before becoming ready.' >&2
              exit 1
            fi

            sleep 2
          done

          printf 'Timed out waiting for %s after 60 seconds.\n' "$health_url" >&2
          printf 'Last health response:\n' >&2
          cat "$log_file" >&2 || true
          exit 1

  android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    uses: pschmitt/ci-workflows/.github/workflows/build.yaml@main
    with:
      project-directory: android
      unit-test-task: :app:testDebugUnitTest
      gradle-task: :app:assembleDebug
      apk-dir: app/build/outputs/apk/debug
      artifact-prefix: app
      compute-version-name: true
    secrets: inherit
    permissions:
      contents: read
