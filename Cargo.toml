[package]
name = "stricknani-server"
version = "1.1.1"
edition = "2024"
publish = false

[dependencies]
regex = "1"
encoding_rs = "0.8"
scraper = { version = "0.29", features = ["atomic"] }
lopdf = "0.47"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"
ammonia = "4"
pulldown-cmark = "0.13"
subtle = "2"
url = "2"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
flate2 = "1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tower", "tower-http", "tower-axum-matched-path", "tracing"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bcrypt = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
openidconnect = { version = "=4.1.0", default-features = false }
zeroize = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
hmac = "0.13.0"
hex = "0.4"
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
askama = "0.16"
axum = { version = "0.8", features = ["form", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "fs", "io-util", "signal", "time", "process", "sync"] }
tower-http = { version = "0.7", features = ["fs"] }

[dev-dependencies]
sentry = { version = "0.49", default-features = false, features = ["test"] }
http-body-util = "0.1"
rsa = { version = "=0.9.10", features = ["pem"] }
